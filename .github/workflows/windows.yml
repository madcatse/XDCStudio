name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned dependencies
        run: ./fetch-dependencies.ps1
      - name: Build portable
        run: ./build.ps1 -Package
      - name: Run synthetic tests
        run: ./tests/run.ps1
      - name: Package source
        run: ./package-source.ps1
      - name: Save distributions and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XdcStudio-windows-x64
          path: |
            dist/*.zip
            tests/output/**/*.json
            tests/output/**/*.txt
          if-no-files-found: error
